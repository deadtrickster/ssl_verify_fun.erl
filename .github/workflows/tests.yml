---
name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest rebar3 does not run on OTP 25
          - otp: '25'
            rebar3: '3.24.0'
          - otp: '26'
            rebar3: '3'
          - otp: '27'
            rebar3: '3'
          - otp: '28'
            rebar3: '3'
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}
      - run: rebar3 compile
      - run: rebar3 eunit
      - run: rebar3 dialyzer
