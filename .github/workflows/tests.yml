---
name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: OTP ${{ matrix.otp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '24'
            os: ubuntu-22.04
          - otp: '25'
            os: ubuntu-24.04
          - otp: '26'
            os: ubuntu-24.04
          - otp: '27'
            os: ubuntu-24.04
          - otp: '28'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'
      - run: rebar3 compile
      - run: rebar3 eunit
      - run: rebar3 dialyzer
